name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MIN_EXPECTED_PYTHON_SOURCES: '8'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run the bounded scientific sequence from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/p054-scientific"
          mkdir -p "$OUT"
          ulimit -v 2560000
          ulimit -t 120
          timeout --signal=TERM --kill-after=10s 180s bash -euo pipefail -c '
            python -B .github/scripts/check_repository.py
            python -B tests/requirements_regression.py
            python -B tests/semantic_regressions.py --out "$OUT/regressions"
            python -B tests/contracts.py --out "$OUT/contracts"
            python -B tests/final_replay.py --out "$OUT/replay"
            python -B tools/campaign.py --out "$OUT/campaign"
            python -B tools/summarize.py --campaign "$OUT/campaign" --out "$OUT/tables"
            python -B tests/check_reproduction.py --campaign "$OUT/campaign" --tables "$OUT/tables"
          ' 2>&1 | tee "$OUT/run.log"
      - name: Retain raw outputs including partial or failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p054-scientific-raw
          path: ${{ runner.temp }}/p054-scientific/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  native-correctness:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch the pinned official compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'zig-0.15.2.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Compiler archive differs from the official release' }
          $tools = Join-Path $env:RUNNER_TEMP 'zig-toolchain'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          "ZIG_EXE=$(Join-Path $tools 'zig-x86_64-windows-0.15.2/zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Populate the cold compiler cache before one-CPU conformance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          work = Path(os.environ['RUNNER_TEMP']) / 'p054-native'
          build = work / 'build'
          for name in ('tmp', 'local-cache', 'global-cache'):
              (build / name).mkdir(parents=True, exist_ok=True)
          environment = os.environ.copy()
          environment.update(TEMP=str(build / 'tmp'), TMP=str(build / 'tmp'),
                             ZIG_LOCAL_CACHE_DIR=str(build / 'local-cache'),
                             ZIG_GLOBAL_CACHE_DIR=str(build / 'global-cache'))
          command = [os.environ['ZIG_EXE'], 'c++', '-std=c++17', '-O2', '-Wall',
                     '-Wextra', '-Werror', '-target', 'x86_64-windows-gnu', '-shared',
                     str(root / 'native' / 'allocator.cpp'), '-o',
                     str(work / 'p054-cold-allocator.dll')]
          subprocess.run(command, env=environment, check=True, timeout=600)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Cold allocator compilation failed' }
      - name: Compile, execute actual buffer traces, and audit outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'p054-native'
          ./native/bounded.ps1 -Mode Compile -WorkRoot $work -Zig "$env:ZIG_EXE" -WallSeconds 240 -MemoryMiB 2048
          ./native/bounded.ps1 -Mode Conformance -WorkRoot $work -Zig "$env:ZIG_EXE" -WallSeconds 120 -MemoryMiB 1024
          python -B native/check_native.py "$work/conformance"
          if ($LASTEXITCODE -ne 0) { throw 'Independent native checks failed' }
      - name: Retain correctness evidence; do not benchmark shared runners
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p054-native-correctness
          path: |
            ${{ runner.temp }}/p054-native/conformance/
            ${{ runner.temp }}/p054-native/*.log
          if-no-files-found: warn
          retention-days: 14
